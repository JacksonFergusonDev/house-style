# Scan working-tree files in both pre-commit and CI.
[extend]
useDefault = true

[[allowlists]]
description = "Generated local output (Git internals and node_modules use default exclusions)"
paths = [
    '''(^|/)(test-results|playwright-report|__pycache__|\.rumdl_cache|\.ruff_cache|\.mypy_cache)(/|$)''',
]

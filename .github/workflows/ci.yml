name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  setup:
    name: Select Playwright image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      playwright-image: ${{ steps.playwright-image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Resolve the locked Playwright image
        id: playwright-image
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          tag="v${version}-noble"
          digest=$(curl --fail --silent --show-error --retry 3 --max-time 30 --head \
            --header 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
            --output /dev/null --write-out '%header{docker-content-digest}' \
            "https://mcr.microsoft.com/v2/playwright/manifests/${tag}")
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::No valid Playwright image digest found for ${tag}"
            exit 1
          fi
          echo "image=mcr.microsoft.com/playwright:${tag}@${digest}" >> "$GITHUB_OUTPUT"

  checks:
    name: Checks
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ${{ needs.setup.outputs.playwright-image }}
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      # setup-python's builds lack the ssl module inside the Playwright image, so
      # pip can't reach PyPI; uv's Python has it. The venv sits outside the
      # checkout so the linters and secret scan never read it.
      - name: Set up Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.12'
          activate-environment: true
          venv-path: ${{ runner.temp }}/venv
          enable-cache: false

      - name: Install development tools
        run: |
          npm ci
          uv pip install prek==0.5.7

      - name: Cache hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run the shared pre-commit checks
        run: |
          # Firefox requires its home directory to belong to the current user.
          chown "$(id -u):$(id -g)" "$HOME"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          prek run --all-files --show-diff-on-failure

      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

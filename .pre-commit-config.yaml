default_install_hook_types:
  - pre-commit
  - commit-msg

default_stages:
  - pre-commit

repos:
  # Generic hooks
  - repo: builtin
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-executables-have-shebangs
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml

  # Shared local and CI checks. CI runs this stage with --all-files.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx --no-install prettier --write --ignore-unknown
        language: system
        require_serial: true
        files: \.(js|ts|css|json|md|yaml|yml)$

      - id: eslint
        name: eslint
        entry: npx --no-install eslint
        language: system
        require_serial: true
        files: \.([jt]s|mjs|cjs)$

      - id: stylelint
        name: stylelint
        entry: npx --no-install stylelint
        language: system
        require_serial: true
        files: \.css$

      - id: javascript-tests
        name: JavaScript tests
        entry: npm test
        language: system
        pass_filenames: false
        files: ^(js/.*\.[jt]s|tests/unit/.*\.test\.js|package(-lock)?\.json|\.pre-commit-config\.yaml)$

      - id: python-tests
        name: Python tests
        entry: npm run test:python
        language: system
        pass_filenames: false
        files: ^(scripts/.*\.py|tests/unit/.*\.py|package(-lock)?\.json|\.pre-commit-config\.yaml)$

      - id: ruff-check
        name: Ruff lint
        entry: ruff check scripts tests/unit
        language: python
        additional_dependencies: [ruff==0.17.2]
        pass_filenames: false
        files: ^(scripts/.*\.py|tests/unit/.*\.py|pyproject\.toml|\.pre-commit-config\.yaml)$

      - id: ruff-format
        name: Ruff format
        entry: ruff format scripts tests/unit
        language: python
        additional_dependencies: [ruff==0.17.2]
        pass_filenames: false
        files: ^(scripts/.*\.py|tests/unit/.*\.py|pyproject\.toml|\.pre-commit-config\.yaml)$

      - id: mypy
        name: mypy
        entry: mypy
        language: python
        additional_dependencies: [mypy==2.4.0]
        pass_filenames: false
        files: ^(scripts/.*\.py|tests/unit/.*\.py|pyproject\.toml|\.pre-commit-config\.yaml)$

      - id: writing-voice
        name: Writing voice
        entry: python3 scripts/check_voice.py
        language: system
        files: \.md$

      - id: browser-tests
        name: Browser tests (Chromium, Firefox, WebKit)
        entry: npm run test:browser
        language: system
        pass_filenames: false
        files: ^(css/.*\.css|js/.*\.js|astro/.*\.astro|icons/.*\.svg|tests/browser/.*\.js|playwright\.config\.js|package(-lock)?\.json|\.pre-commit-config\.yaml)$

  # Validate workflows with the same check locally and in CI.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # Check for accidental commits of secrets
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        entry: gitleaks dir --redact --verbose

  # Commit message validation
  - repo: https://github.com/Goldziher/gitfluff
    rev: v0.8.0
    hooks:
      - id: gitfluff-lint
        args: [--write]
        stages: [commit-msg]

  # Markdown linting
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.73
    hooks:
      - id: rumdl
        args: [--fix, .]
        types: [file]
        files: (\.md$|^(pyproject\.toml|\.pre-commit-config\.yaml)$)
        pass_filenames: false
      - id: rumdl-fmt
        args: [.]
        types: [file]
        files: (\.md$|^(pyproject\.toml|\.pre-commit-config\.yaml)$)
        pass_filenames: false

default_install_hook_types:
  - pre-commit
  - commit-msg

default_stages:
  - pre-commit

repos:
  # Generic hooks
  - repo: builtin
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-executables-have-shebangs
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # pnpm separates package-manager and project locks into YAML documents.
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml

  # Shared local and CI checks. CI runs this stage with --all-files.
  - repo: local
    hooks:
      - id: pnpm-lock-check
        name: pnpm lock check
        entry: pnpm install --lockfile-only --frozen-lockfile --ignore-scripts --offline
        language: system
        pass_filenames: false
        files: ^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.npmrc|\.pre-commit-config\.yaml)$

      - id: prettier
        name: prettier
        entry: pnpm exec prettier --write --ignore-unknown
        language: system
        require_serial: true
        files: \.(js|mjs|ts|css|json|md|yaml|yml)$

      - id: eslint
        name: eslint
        entry: pnpm exec eslint
        language: system
        require_serial: true
        files: \.([jt]s|mjs|cjs)$
        exclude: ^js/

      - id: stylelint
        name: stylelint
        entry: pnpm exec stylelint
        language: system
        require_serial: true
        files: \.css$

      - id: typescript-build
        name: TypeScript and generated JavaScript
        entry: pnpm run build:check
        language: system
        pass_filenames: false
        files: ^(src/.*\.ts|js/.*|scripts/build\.mjs|tsconfig\.json|\.prettierrc\.json|package\.json|pnpm-lock\.yaml|\.pre-commit-config\.yaml)$

      - id: javascript-tests
        name: JavaScript tests
        entry: pnpm test
        language: system
        pass_filenames: false
        files: ^(src/.*\.ts|js/.*\.[jt]s|scripts/build\.mjs|tsconfig\.json|\.prettierrc\.json|tests/unit/.*\.test\.js|package\.json|pnpm-lock\.yaml|\.pre-commit-config\.yaml)$

      - id: python-tests
        name: Python tests
        entry: pnpm run test:python
        language: system
        pass_filenames: false
        files: ^(scripts/.*\.py|tests/unit/.*\.py|package\.json|pnpm-lock\.yaml|\.pre-commit-config\.yaml)$

      - id: ruff-check
        name: Ruff lint
        entry: ruff check scripts tests/unit
        language: python
        additional_dependencies: [ruff==0.17.2]
        pass_filenames: false
        files: ^(scripts/.*\.py|tests/unit/.*\.py|pyproject\.toml|\.pre-commit-config\.yaml)$

      - id: ruff-format
        name: Ruff format
        entry: ruff format scripts tests/unit
        language: python
        additional_dependencies: [ruff==0.17.2]
        pass_filenames: false
        files: ^(scripts/.*\.py|tests/unit/.*\.py|pyproject\.toml|\.pre-commit-config\.yaml)$

      - id: mypy
        name: mypy
        entry: mypy
        language: python
        additional_dependencies: [mypy==2.4.0]
        pass_filenames: false
        files: ^(scripts/.*\.py|tests/unit/.*\.py|pyproject\.toml|\.pre-commit-config\.yaml)$

      - id: writing-voice
        name: Writing voice
        entry: python3 scripts/check_voice.py
        language: system
        files: \.md$

      - id: browser-tests
        name: Browser tests (Chromium, Firefox, WebKit)
        entry: pnpm run test:browser
        language: system
        pass_filenames: false
        files: ^(src/.*\.ts|css/.*\.css|js/.*\.js|astro/.*\.astro|icons/.*\.svg|tests/browser/.*\.js|playwright\.config\.js|package\.json|pnpm-lock\.yaml|\.pre-commit-config\.yaml)$

  # Validate workflows with the same check locally and in CI.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor
        args: [--offline, --no-progress, --strict-collection, .]
        pass_filenames: false
        files: (^|/)(\.github/(workflows/[^/]+|dependabot|zizmor)\.ya?ml|action\.ya?ml|\.pre-commit-(config|hooks)\.ya?ml)$

  # Check for accidental commits of secrets
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        entry: gitleaks dir --redact --verbose

  # Commit message validation
  - repo: https://github.com/Goldziher/gitfluff
    rev: v0.8.0
    hooks:
      - id: gitfluff-lint
        args: [--write]
        stages: [commit-msg]

  # Markdown linting
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.73
    hooks:
      - id: rumdl
        args: [--fix, .]
        types: [file]
        files: (\.md$|^(pyproject\.toml|\.pre-commit-config\.yaml)$)
        pass_filenames: false
      - id: rumdl-fmt
        args: [.]
        types: [file]
        files: (\.md$|^(pyproject\.toml|\.pre-commit-config\.yaml)$)
        pass_filenames: false
